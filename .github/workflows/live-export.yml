name: live-export

# 每日把实占案例从 issue 导出成 liuren-live/1 数据集，强推到不留历史的 data 分支。

on:
  schedule:
    - cron: "0 20 * * *"      # 北京时间每天 04:00
  workflow_dispatch:

permissions:
  contents: write
  issues: read

concurrency:
  group: live-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ./core ./bot

      - name: Export
        run: python -m liuren_bot export "$RUNNER_TEMP/data"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to data branch (no history)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd "$RUNNER_TEMP/data"
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "export $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
