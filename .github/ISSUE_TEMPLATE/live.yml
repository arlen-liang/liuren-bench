name: 实占下注
description: 不会用 git？在这里下注，维护者帮你转成 cases/live/ 里的文件。以 issue 创建时间为下注时间
title: "[下注] 起课日期：占事一句话"
labels: ["live-case"]
body:
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 这是我自己的事；或者涉及别人，但别人看了认不出是谁
          required: true
        - label: 没有真名、单位名、具体地址，不涉及未成年人
          required: true
        - label: 结果还没出来（出来了也能交，但会标"马后炮"，不进统计）
          required: true
  - type: input
    id: time
    attributes:
      label: 起课时间
      description: 北京时间，精确到分钟。用真太阳时的写上城市
    validations:
      required: true
  - type: input
    id: question
    attributes:
      label: 占事
      description: 一句话，比如"本周五前能否收到面试回复"
    validations:
      required: true
  - type: dropdown
    id: outcome
    attributes:
      label: 断：成还是不成
      options:
        - 成
        - 不成
    validations:
      required: true
  - type: input
    id: window
    attributes:
      label: 应期
      description: 结果会在什么时间区间内出现，比如"10 月 10 日前"
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: 把握
      options: [5成, 6成, 7成, 8成, 9成]
    validations:
      required: true
  - type: textarea
    id: basis
    attributes:
      label: 依据（可选）
      description: 课盘、断的理由，想写多少写多少
